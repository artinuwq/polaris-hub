<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="assets/css/app.css" />
    <link rel="stylesheet" href="assets/css/tasks.css" />
  </head>
  <body>  
    <div class="app-shell"> 
      <header class="topbar">
        <button id="drawer-toggle" class="icon-button" type="button" aria-label="Открыть навигацию">
          <span class="icon" data-icon="menu" aria-hidden="true"></span>
        </button>

        <button id="search-capsule" class="search-capsule" type="button" aria-label="Поиск">
          <span class="icon" data-icon="search" aria-hidden="true"></span>
          <span id="search-capsule-text" class="search-capsule-title">Polaris</span>
        </button>

        <button id="search-toggle" class="icon-button" type="button" aria-label="Поиск">
          <span class="icon" data-icon="search" aria-hidden="true"></span>
        </button>

        <section id="search-overlay" class="search-overlay" aria-hidden="true">
          <div class="search-panel" role="dialog" aria-modal="true" aria-label="Глобальный поиск">
            <label class="search-field">
              <span class="icon" data-icon="search" aria-hidden="true"></span>
              <input id="search-input" type="search" placeholder="Search…" autocomplete="off" />
            </label>

            <div id="search-hints" class="search-hints"></div>
            <div id="search-results" class="search-results"></div>
          </div>
        </section>
      </header>

      <main id="main-content" class="main-content">
        <section class="card skeleton-card">
          <div class="skeleton-line skeleton-line-title"></div>
          <div class="skeleton-line"></div>
          <div class="skeleton-line"></div>
        </section>
      </main>
    </div>

    <aside id="drawer" class="drawer" aria-label="Навигация" aria-hidden="true">
      <div class="drawer-header">
        <p class="drawer-eyebrow">Navigation</p>
      </div>
      <nav id="drawer-nav" class="drawer-nav"></nav>
      <div class="drawer-footer">
        <p>Attention first. Остальное открывается по запросу.</p>
      </div>
    </aside>

    <div id="backdrop" class="backdrop" hidden></div>
    <div id="swipe-hint" class="swipe-hint"></div>

    <script src="assets/js/tasks.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
      // Auto-versioning: append file modification time to prevent caching issues
      (function() {
        const version = Date.now();
        const links = document.querySelectorAll('link[rel="stylesheet"]');
        links.forEach(link => {
          const href = link.getAttribute('href');
          if (href && !href.includes('?')) {
            link.setAttribute('href', href + '?v=' + version);
          }
        });
        const scripts = document.querySelectorAll('script[src]');
        scripts.forEach(script => {
          const src = script.getAttribute('src');
          if (src && !src.includes('?')) {
            script.setAttribute('src', src + '?v=' + version);
          }
        });
      })();
    </script>
  </body>
</html>
