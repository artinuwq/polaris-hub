<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris Mini App</title>
    <link rel="stylesheet" href="assets/css/app.css" />
    <script src="assets/vendor/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <h1>Polaris</h1>
      <p class="subtitle">Управление и обновление</p>

      <section class="panel">
        <h2>Обновление</h2>
        <p id="update-status" class="status">Нажмите «Проверить», чтобы узнать версию.</p>
        <div class="actions">
          <button id="check-update" type="button">Проверить</button>
          <button id="run-update" type="button" class="primary">Обновить</button>
        </div>
      </section>
    </main>
    <script src="assets/js/app.js"></script>
  </body>
</html>
